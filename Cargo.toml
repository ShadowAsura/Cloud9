[workspace]
members = ["crates/core", "crates/app", "crates/mc", "crates/world", "crates/server", "crates/cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tempfile = "3"
cloud9-core = { path = "crates/core" }
